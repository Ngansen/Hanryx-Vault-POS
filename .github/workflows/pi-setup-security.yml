name: pi-setup security

on:
  pull_request:
    paths:
      - 'pi-setup/**'
      - '.github/workflows/pi-setup-security.yml'
  push:
    branches: [main]
    paths:
      - 'pi-setup/**'
      - '.github/workflows/pi-setup-security.yml'
  # Nightly run is mainly here for the network-dependent jobs that
  # compare in-tree pins against UPSTREAM state — `image-pins-resolve`
  # (catches retired tags), `debian-snapshot-date-published` (catches
  # pruned snapshot dates), and the digest-drift job below (catches
  # half-bumped pins and silent supply-chain re-pushes against tags
  # that haven't been edited in this repo at all). A PR-only schedule
  # would never notice those drifts on a quiet week. The static jobs
  # (no-insecure-tls, no-plaintext-http, no-floating-tags,
  # lockfile-drift) ride along — they're cheap and re-running them
  # nightly costs nothing. The :17 minute offset keeps us out of the
  # top-of-hour cron stampede on shared GH runners.
  schedule:
    - cron: '17 6 * * *'
  # Manual re-run with the network-outage escape hatches. Only the
  # drift-on-pinned-tags job actually consumes the input today;
  # the read-only `image-pins-resolve` and `debian-snapshot-date`
  # jobs don't expose an equivalent flag (yet). Default is OFF so a
  # casual "Re-run all jobs" click in the GitHub UI doesn't silently
  # turn the supply-chain guard into a no-op. Use only after
  # confirming by hand that registry-1.docker.io is genuinely down.
  workflow_dispatch:
    inputs:
      skip_image_digest_drift_on_network_error:
        description: 'Pass image-pins-no-digest-drift if Docker Hub is unreachable (use sparingly — bypasses the supply-chain guard for a confirmed outage)'
        type: boolean
        required: false
        default: false

jobs:
  no-insecure-tls:
    name: Block insecure-TLS shortcuts in pi-setup/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan pi-setup/ for insecure-TLS patterns
        run: python3 pi-setup/scripts/check-no-insecure-tls.py

  no-plaintext-http:
    name: Block plaintext outbound calls (http/ws/mqtt/ftp) in pi-setup/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Covers http://, ws://, mqtt://, ftp:// — every scheme that has a
      # TLS-protected sibling (https/wss/mqtts/ftps/sftp). Internal-host
      # allow-list and `hanryx-allow-plaintext` marker apply identically
      # to every scheme.
      - name: Scan pi-setup/ for plaintext external URLs (http/ws/mqtt/ftp)
        run: python3 pi-setup/scripts/check-no-plaintext-http.py

      # Unit tests pin the scanner's classification contract: every shape
      # on the internal-host allow-list (RFC 1918, CGNAT, .local/.ts.net,
      # bare hostnames, placeholders), the XML-namespace skip, and both
      # marker spellings (same line and line-immediately-above). Without
      # these, a future edit could silently widen the allow-list — e.g.
      # treating `evil.local.attacker.com` as internal — and CI would
      # still pass on a clean tree. Uses the stdlib unittest runner so
      # the job needs no extra pip install.
      - name: Run unit tests for the plaintext-HTTP scanner
        run: python3 -m unittest discover -s pi-setup/scripts/tests -v

  no-floating-tags:
    name: Block floating Docker tags in pi-setup/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan pi-setup/ for floating Docker tags
        run: python3 pi-setup/scripts/check-no-floating-tags.py

  lockfile-drift:
    name: Catch Python lockfile drift in pi-setup/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # `lock-python-deps.sh` shells out to `uv pip compile`. The script
      # tolerates either a standalone `uv` binary or `python3 -m uv`, so
      # installing via pip is enough — no need for a third-party action.
      - name: Install uv
        run: python3 -m pip install --upgrade uv

      # Regenerate both lockfiles from the requirements.in sources, exactly
      # the way a contributor is supposed to do it locally.
      - name: Regenerate pi-setup lockfiles from requirements.in
        run: pi-setup/scripts/lock-python-deps.sh all

      # If the regenerated lockfiles differ from what's committed, someone
      # edited requirements.in (or hand-edited requirements.txt) without
      # rerunning the lock script. Fail loudly with the diff in the log so
      # the author can see exactly what they need to commit.
      - name: Fail if lockfiles drifted from requirements.in
        run: |
          if ! git diff --exit-code \
                pi-setup/requirements.txt \
                pi-setup/recognizer/requirements.txt; then
            echo ""
            echo "::error::Lockfile drift detected. The committed requirements.txt files do not match what 'pi-setup/scripts/lock-python-deps.sh all' produces from the requirements.in sources."
            echo "::error::Run 'pi-setup/scripts/lock-python-deps.sh all' locally and commit the regenerated requirements.txt files."
            exit 1
          fi

      # The lock script can't hash git+ URLs, so reproducibility for those
      # deps depends entirely on the URL ending in a full 40-char commit SHA.
      # Reject branch names, tags, and short SHAs in requirements-vcs.txt.
      - name: Verify VCS pins in requirements-vcs.txt are full 40-char SHAs
        run: python3 pi-setup/scripts/check-vcs-pins-are-full-shas.py

      # Unit tests pin the SHA checker's classification contract: the
      # FULL_SHA_RE regex (full lowercase 40-char hex passes; short SHA,
      # uppercase, mixed case, branch name, tag, slashed branch, empty
      # string, and 41-char strings all fail), the GIT_PIN_RE extractor
      # (stops at `#` egg fragments and whitespace, ignores plain https
      # links, finds every pin on its own line), and the comment-skip
      # rule in main() (a full-line comment containing `@main` example
      # text must NOT be misread as a real bad pin). Without these, a
      # sloppy edit to either regex could silently start letting branch
      # names back through and the only signal would be a broken Pi
      # rebuild weeks later. Uses the stdlib unittest runner so the job
      # needs no extra pip install; only the SHA-pin test file is
      # selected so an unrelated test failure in the shared tests/
      # directory doesn't gate this job.
      - name: Run unit tests for the VCS-pin SHA checker
        run: python3 -m unittest pi-setup.scripts.tests.test_check_vcs_pins_are_full_shas -v

  image-pins-resolve:
    name: Verify Docker Hub image pins still resolve
    runs-on: ubuntu-latest
    # registry-1.docker.io is occasionally rate-limited / slow — give
    # the job plenty of headroom on top of the script's per-request
    # retry/backoff. The script also caches by (repo, tag) so the same
    # image pinned in two stages (builder + runtime) is only one HTTP
    # round-trip.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # For every name:tag@sha256:<digest> pin in pi-setup/, hit
      # registry-1.docker.io and confirm BOTH that the tag still
      # resolves to a manifest (no 404 — i.e. the upstream maintainer
      # didn't retire it, the way edoburu/pgbouncer:1.21.0 was retired
      # under us) AND that the resolved manifest digest still matches
      # the pinned digest (no silent supply-chain re-push). Fails the
      # build with a clear message naming the offending image if
      # either check fails.
      - name: Verify each pinned tag still resolves and digest matches
        run: python3 pi-setup/scripts/check-image-pins-resolve.py

  image-pins-no-digest-drift:
    name: Detect upstream digest drift on already-pinned tags
    runs-on: ubuntu-latest
    # registry-1.docker.io can be slow under load; the script's per-
    # request retry/backoff plus this generous job timeout keeps the
    # job from flaking on a routine hiccup. The same per-(repo, tag)
    # cache the refresher uses means each unique image is one HTTP
    # round-trip even when several stages pin it.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Why this exists, even though `image-pins-resolve` above already
      # fails on digest drift:
      #
      #   * `image-pins-resolve` is the read-only checker — it answers
      #     "does the digest in the file still match upstream?" with no
      #     mutation path.
      #   * THIS job runs the WRITE-CAPABLE refresher in dry-run mode.
      #     The dry-run output IS the diff a maintainer would commit if
      #     they ran `--write` locally, so a failure here lands with the
      #     exact patch the maintainer needs to review and apply.
      #
      # Two failure modes this catches before they reach the Pi:
      #
      #   1. Half-bumped pin: a maintainer edited the tag (e.g.
      #      python:3.11.10 → 3.11.11) but forgot to refresh the digest.
      #      `docker compose build` on the Pi would refuse the manifest
      #      mismatch; this job catches it on the PR with a one-line
      #      diff.
      #   2. Upstream silently re-pushed an existing tag with different
      #      bits. Tags are nominally immutable but technically mutable
      #      on Docker Hub — this is exactly the failure mode the
      #      digest pin was designed to detect, and surfacing it here
      #      gives the maintainer a chance to investigate the unexpected
      #      re-push (real bump? compromised account?) before bumping.
      #
      # `--skip-on-network-error` is intentionally NOT passed on PR /
      # push / scheduled runs: a Docker Hub outage on a single PR
      # should fail loudly so the maintainer notices, not silently
      # pass. The only path that enables it is a manual
      # `workflow_dispatch` re-run with the matching input set to
      # `true` — meant for the case where a maintainer has confirmed
      # registry-1.docker.io is genuinely down and just wants the
      # rest of the workflow to be green. The script itself still
      # only suppresses lookup errors classified as
      # `network_only=True`; a 404 for a specific tag, or any digest
      # drift on tags that DID resolve, still fails.
      - name: Refresher dry-run — fail if any pinned tag drifted upstream
        env:
          # `inputs.*` is the empty string on non-workflow_dispatch
          # triggers; only literal "true" turns the flag on. Compare
          # in the shell so a missing input falls through cleanly.
          SKIP_FLAG_REQUESTED: ${{ inputs.skip_image_digest_drift_on_network_error }}
        run: |
          if [ "${SKIP_FLAG_REQUESTED}" = "true" ]; then
            echo "::warning::Running with --skip-on-network-error per workflow_dispatch input. The script will still fail on any 4xx or on digest drift in tags that DID resolve; only total network-outage failures are suppressed."
            python3 pi-setup/scripts/refresh-image-digests.py --skip-on-network-error
          else
            python3 pi-setup/scripts/refresh-image-digests.py
          fi

  debian-snapshot-date-published:
    name: Verify APT_SNAPSHOT_DATE is published on snapshot.debian.org
    runs-on: ubuntu-latest
    # snapshot.debian.org is occasionally slow / under load — give the job
    # plenty of headroom on top of the script's per-URL retry/backoff.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify each APT_SNAPSHOT_DATE exists on snapshot.debian.org
        run: python3 pi-setup/scripts/check-debian-snapshot-date.py

      # Unit tests pin the checker's parsing + classification contract:
      # the Dockerfile ARG parser (single-stage, multi-stage, inline
      # comments, indentation, case-insensitive ARG, negative match for
      # similarly-named vars), the `YYYYMMDDTHHMMSSZ` date validator,
      # the HTTP retry policy (200 passes, 404 is terminal, 5xx and
      # network errors retry up to MAX_ATTEMPTS), and the
      # --skip-on-network-error escape hatch (passes only when EVERY
      # finding is a network/timeout error; a real 4xx mixed in still
      # fails). Without these, a future refactor could silently stop
      # catching bad APT_SNAPSHOT_DATE pins and we'd only find out the
      # next time a docker compose build 404'd on the Pi. Uses the
      # stdlib unittest runner so the job needs no extra pip install;
      # only the snapshot-date test file is selected so an unrelated
      # test failure in the shared tests/ directory doesn't gate this
      # job (the no-plaintext-http job already runs the full discover).
      - name: Run unit tests for the snapshot-date checker
        run: python3 -m unittest pi-setup.scripts.tests.test_check_debian_snapshot_date -v
